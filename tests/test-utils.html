<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anđelin Ciklus — Utility Tests</title>
  <!-- Mocha + Chai from CDN -->
  <link rel="stylesheet" href="https://unpkg.com/mocha@10.8.2/mocha.css">
  <script src="https://unpkg.com/mocha@10.8.2/mocha.js"></script>
  <script src="https://unpkg.com/chai@5.1.2/chai.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      padding: 1rem 2rem;
      background: #fafafa;
    }
    #mocha { max-width: 960px; margin: 0 auto; }
    .summary-note {
      max-width: 960px;
      margin: 1rem auto;
      padding: 0.75rem 1rem;
      background: #fff3cd;
      border: 1px solid #ffc107;
      border-radius: 6px;
      font-size: 0.9rem;
      color: #664d03;
    }
  </style>
</head>
<body>
  <div id="mocha"></div>
  <div class="summary-note">
    Open DevTools (F12) to see which tests pass/fail. This page tests the core utility functions
    that power the Anđelin Ciklus cycle tracker — safeParse, debounce, fmtDate, and daysDiff.
  </div>

  <script>
    "use strict";

    mocha.setup({
      ui: 'bdd',
      reporter: 'html',
      timeout: 2000,
    });

    const { expect, assert } = chai;

    /* ================================================================
       REIMPLEMENTED: safeParse()
       Safely parse JSON, returning a default on null / invalid / undefined.
       ================================================================ */
    function safeParse(text, defaultVal) {
      if (text == null) return defaultVal;
      try { return JSON.parse(text); }
      catch (e) { return defaultVal; }
    }

    /* ================================================================
       REIMPLEMENTED: debounce()
       Returns a debounced version of `fn` that waits `delay` ms before
       executing. Only the last call within the window fires.
       ================================================================ */
    function debounce(fn, delay) {
      let timer = null;
      const debounced = function (...args) {
        const ctx = this;
        if (timer !== null) clearTimeout(timer);
        timer = setTimeout(() => {
          timer = null;
          fn.apply(ctx, args);
        }, delay);
      };
      debounced.cancel = function () {
        if (timer !== null) {
          clearTimeout(timer);
          timer = null;
        }
      };
      return debounced;
    }

    /* ================================================================
       REIMPLEMENTED: fmtDate()
       Format a Date as "YYYY-MM-DD". Returns fallback string when input
       is not a valid Date instance.
       ================================================================ */
    function fmtDate(d) {
      if (!(d instanceof Date) || isNaN(d.getTime())) {
        return '—';
      }
      return d.getFullYear() + '-' +
        String(d.getMonth() + 1).padStart(2, '0') + '-' +
        String(d.getDate()).padStart(2, '0');
    }

    /* ================================================================
       REIMPLEMENTED: daysDiff()
       Calculate the number of days between two dates (b - a).
       Handles invalid dates by returning NaN.
       ================================================================ */
    function daysDiff(a, b) {
      if (!(a instanceof Date) || !(b instanceof Date) ||
          isNaN(a.getTime()) || isNaN(b.getTime())) {
        return NaN;
      }
      return Math.round((b.getTime() - a.getTime()) / 86400000);
    }

    /* ================================================================
       SUITE: safeParse
       ================================================================ */
    describe('safeParse()', function () {
      it('parses a valid JSON object and returns the parsed value', function () {
        const result = safeParse('{"a":1,"b":"hello"}', {});
        expect(result.a).to.equal(1);
        expect(result.b).to.equal('hello');
      });

      it('parses a valid JSON array', function () {
        const result = safeParse('[1,2,3]', []);
        expect(result).to.deep.equal([1, 2, 3]);
      });

      it('returns defaultVal when input is null', function () {
        expect(safeParse(null, 'default')).to.equal('default');
      });

      it('returns defaultVal when input is undefined', function () {
        expect(safeParse(undefined, 'default')).to.equal('default');
      });

      it('returns defaultVal when input is an empty string', function () {
        expect(safeParse('', 'default')).to.equal('default');
      });

      it('returns defaultVal when input is malformed JSON', function () {
        expect(safeParse('not json', 'default')).to.equal('default');
        expect(safeParse('{bad}', 'fallback')).to.equal('fallback');
      });

      it('parses a JSON number string correctly', function () {
        expect(safeParse('42', 0)).to.equal(42);
      });

      it('parses a JSON boolean string correctly', function () {
        expect(safeParse('true', false)).to.equal(true);
      });

      it('parses a JSON string value', function () {
        expect(safeParse('"a string"', '')).to.equal('a string');
      });

      it('returns defaultVal when a number is passed (not stringifiable)', function () {
        // The function calls JSON.parse — a number is not a string, so
        // JSON.parse coerces it to a string first.
        expect(safeParse(42, 'fallback')).to.equal('fallback');
      });
    });

    /* ================================================================
       SUITE: debounce
       ================================================================ */
    describe('debounce()', function () {
      it('does not call the function immediately', function (done) {
        let called = false;
        const deb = debounce(() => { called = true; }, 100);
        deb();
        expect(called).to.be.false;
        done();
      });

      it('calls the function once after the delay', function (done) {
        let callCount = 0;
        const deb = debounce(() => { callCount++; }, 50);
        deb();
        setTimeout(() => {
          expect(callCount).to.equal(1);
          done();
        }, 100);
      });

      it('calls only the last invocation when called multiple times', function (done) {
        let lastArg = null;
        const deb = debounce((x) => { lastArg = x; }, 50);
        deb('a');
        deb('b');
        deb('c');
        setTimeout(() => {
          expect(lastArg).to.equal('c');
          done();
        }, 100);
      });

      it('preserves `this` context', function (done) {
        const obj = { name: 'hello', debounced: null };
        obj.debounced = debounce(function () {
          expect(this.name).to.equal('hello');
          done();
        }, 30);
        obj.debounced();
      });

      it('.cancel() prevents the delayed call from firing', function (done) {
        let called = false;
        const deb = debounce(() => { called = true; }, 50);
        deb();
        deb.cancel();
        setTimeout(() => {
          expect(called).to.be.false;
          done();
        }, 100);
      });

      it('queues a new delay after each call (restarts timer)', function (done) {
        let callCount = 0;
        const deb = debounce(() => { callCount++; }, 80);
        deb();
        setTimeout(() => deb(), 40);   // restart timer at 40ms
        setTimeout(() => deb(), 80);   // restart timer at 80ms
        setTimeout(() => {
          // With restarts, the call fires 80ms after last invocation (160ms total)
          expect(callCount).to.equal(1);
          done();
        }, 200);
      });
    });

    /* ================================================================
       SUITE: fmtDate
       ================================================================ */
    describe('fmtDate()', function () {
      it('formats a standard date as YYYY-MM-DD', function () {
        expect(fmtDate(new Date(2026, 5, 15))).to.equal('2026-06-15');
      });

      it('pads single-digit month', function () {
        expect(fmtDate(new Date(2026, 0, 1))).to.equal('2026-01-01');
      });

      it('pads single-digit day', function () {
        expect(fmtDate(new Date(2026, 2, 3))).to.equal('2026-03-03');
      });

      it('handles December dates', function () {
        expect(fmtDate(new Date(2026, 11, 9))).to.equal('2026-12-09');
      });

      it('leap year February 29', function () {
        expect(fmtDate(new Date(2024, 1, 29))).to.equal('2024-02-29');
      });

      it('last day of the year', function () {
        expect(fmtDate(new Date(2026, 11, 31))).to.equal('2026-12-31');
      });

      it('first day of the year', function () {
        expect(fmtDate(new Date(2026, 0, 1))).to.equal('2026-01-01');
      });

      it('returns a fallback string when input is invalid (null)', function () {
        expect(fmtDate(null)).to.equal('—');
      });

      it('returns a fallback string when input is invalid (undefined)', function () {
        expect(fmtDate(undefined)).to.equal('—');
      });

      it('returns a fallback string when input is not a Date object', function () {
        expect(fmtDate('2026-06-15')).to.equal('—');
      });

      it('returns a fallback string when Date is invalid (NaN time)', function () {
        expect(fmtDate(new Date('not-a-date'))).to.equal('—');
      });
    });

    /* ================================================================
       SUITE: daysDiff
       ================================================================ */
    describe('daysDiff()', function () {
      const d1 = new Date(2026, 5, 15);

      it('returns positive difference when b is after a', function () {
        expect(daysDiff(d1, new Date(2026, 5, 20))).to.equal(5);
      });

      it('returns negative difference when b is before a', function () {
        expect(daysDiff(new Date(2026, 5, 20), d1)).to.equal(-5);
      });

      it('returns 0 for the same date', function () {
        expect(daysDiff(d1, new Date(2026, 5, 15))).to.equal(0);
      });

      it('1 year difference', function () {
        expect(daysDiff(d1, new Date(2027, 5, 15))).to.equal(365);
      });

      it('handles DST transitions approximately (within 1 day)', function () {
        const mar1 = new Date(2026, 2, 1);
        const mar8 = new Date(2026, 2, 8);
        expect(daysDiff(mar1, mar8)).to.equal(7);
      });

      it('across month boundaries', function () {
        expect(daysDiff(new Date(2026, 5, 28), new Date(2026, 6, 3))).to.equal(5);
      });

      it('non-leap year Feb 28 to Mar 1', function () {
        expect(daysDiff(new Date(2025, 1, 28), new Date(2025, 2, 1))).to.equal(1);
      });

      it('leap year Feb 28 to Feb 29', function () {
        expect(daysDiff(new Date(2024, 1, 28), new Date(2024, 1, 29))).to.equal(1);
      });

      it('returns NaN when first arg is invalid', function () {
        expect(isNaN(daysDiff(null, new Date()))).to.be.true;
      });

      it('returns NaN when second arg is invalid', function () {
        expect(isNaN(daysDiff(new Date(), null))).to.be.true;
      });

      it('returns NaN when both args are invalid', function () {
        expect(isNaN(daysDiff('bad', undefined))).to.be.true;
      });
    });

    /* ================================================================
       SUITE: Cross-function integration
       ================================================================ */
    describe('Cross-function integration', function () {
      it('safeParse + fmtDate: parses date string and formats', function () {
        const raw = '{"d":"2026-06-15T00:00:00.000Z"}';
        const parsed = safeParse(raw, {});
        const d = new Date(parsed.d);
        expect(fmtDate(d)).to.equal('2026-06-15');
      });

      it('debounce + daysDiff: timed diff computation', function (done) {
        const a = new Date(2026, 0, 1);
        let result = null;
        const deb = debounce(() => {
          result = daysDiff(a, new Date(2026, 0, 11));
        }, 30);
        deb();
        setTimeout(() => {
          expect(result).to.equal(10);
          done();
        }, 80);
      });
    });

    // ── Run ─────────────────────────────────────────────────────────
    mocha.run();
  </script>
</body>
</html>
