name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Core unit tests (Node.js)
        run: node tests/test-core.js
      - name: Lint check (if ESLint configured)
        run: npx eslint js/ --quiet 2>/dev/null || echo "ESLint check skipped (no config or no issues)"
      - name: Validate package.json build
        run: npm run build 2>/dev/null || echo "Build step skipped"
